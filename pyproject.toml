[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snapstream-mcp"
version = "0.1.0"
description = "MCP server for the SnapStream tenant API"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["snapstream_mcp"]

[tool.setuptools.package-data]
snapstream_mcp = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live_write: live suite write tier; needs --live and --live-writes"]
